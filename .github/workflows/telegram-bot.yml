# telegram-bot — central always-on campaign watcher (control tower only).
#
# Runs ONLY in kingmariano/zany-xylophone to avoid duplicate boards, and uses
# CAMPAIGN_GH_TOKEN (a PAT with repo scope) to see/dispatch all campaign repos.
# Without the PAT it falls back to the repo-scoped GITHUB_TOKEN (board limited to
# this repo). Without TELEGRAM_BOT_TOKEN it degrades to logging.
#
# Each tick: completion notices (state-tracked) -> staleness alerts ->
# fallback resume -> refreshed live status board (URL buttons, edited in place).
#
# Secrets: TELEGRAM_BOT_TOKEN, (optional TELEGRAM_CHAT_ID; else /id auto-learns),
#          CAMPAIGN_GH_TOKEN (PAT: repo + workflow scope).
name: telegram-bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'all | board | stale | fallback | poll'
        type: choice
        options: [all, board, stale, fallback, poll]
        default: all

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'kingmariano/zany-xylophone'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CAMPAIGN_GH_TOKEN || github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: .tg_state.json
          key: tg-state-${{ github.run_id }}
          restore-keys: tg-state-

      - name: Tick (completions + stale + fallback + board)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'all')
        run: |
          python3 CA/scripts/telegram.py poll     || true
          python3 CA/scripts/telegram.py board --send || true
          python3 CA/scripts/telegram.py stale    || true
          python3 CA/scripts/telegram.py fallback || true

      - name: Dispatch single mode
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        run: |
          if [ "${{ inputs.mode }}" = "board" ]; then
            python3 CA/scripts/telegram.py board --send
          else
            python3 CA/scripts/telegram.py "${{ inputs.mode }}"
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .tg_state.json
          key: tg-state-${{ github.run_id }}
