# Track A — light batch 1 (A1 initialize, A2 upgrade, A6 fee, A7 unchecked).
# Controls-only sanity first (chunk 0), same gate as stages 1-3.
name: tracka-batch1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sanity (controls only) | full'
        required: false
        default: 'sanity'
        type: choice
        options: [sanity, full]
      chunks:
        description: 'chunk indices (comma-separated); empty = all'
        required: false
        default: ''
        type: string
      resume_run_id:
        required: false
        default: ''
        type: string

jobs:
  run:
    uses: ./.github/workflows/stage-matrix.yml
    with:
      stage: 'tracka_batch1'
      mode: ${{ inputs.mode }}
      chunks: ${{ inputs.chunks }}
      resume_run_id: ${{ inputs.resume_run_id }}
