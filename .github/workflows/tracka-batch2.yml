# Track A — light batch 2 (A9 unauthenticated pull / attacker-named payer).
# Scoped consent invariant: a named victim's balance must not move without consent.
name: tracka-batch2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sanity (controls only) | full'
        required: false
        default: 'sanity'
        type: choice
        options: [sanity, full]
      chunks:
        description: 'chunk indices (comma-separated); empty = all'
        required: false
        default: ''
        type: string
      resume_run_id:
        required: false
        default: ''
        type: string

jobs:
  run:
    uses: ./.github/workflows/stage-matrix.yml
    with:
      stage: 'tracka_batch2'
      mode: ${{ inputs.mode }}
      chunks: ${{ inputs.chunks }}
      resume_run_id: ${{ inputs.resume_run_id }}
