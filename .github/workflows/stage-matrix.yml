# Reusable per-stage Kontrol proof matrix.
#
# Called by stage1-cheap.yml / stage2-deepauth.yml / stage3-math.yml.
# Design:
#   * plan job derives the chunk list (manifest or explicit override)
#   * one matrix job per chunk, one `kontrol prove` invocation per test, so a
#     timeout never erases verdicts already produced
#   * `mode: sanity` runs ONLY chunk 0 (the ground-truth controls) — the
#     "stage N.5" gate. Do not fire the full matrix until sanity is green.
#   * KCFG checkpoints are uploaded; re-dispatch with resume_run_id to continue
#   * verdicts + prove logs are uploaded for the offline live-gate triage
name: stage-matrix

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      chunks:
        description: 'Comma-separated chunk indices; empty = all from manifest'
        required: false
        default: ''
        type: string
      resume_run_id:
        required: false
        default: ''
        type: string
      mode:
        description: 'sanity (controls only) | full'
        required: false
        default: 'full'
        type: string
      src_run_id:
        description: 'run id of a tracka-generate run holding the `tracka-src` artifact (full mode)'
        required: false
        default: ''
        type: string
      wave:
        description: 'wave index when the manifest has more chunks than wave_size'
        required: false
        default: ''
        type: string
      wave_size:
        description: 'max chunks per run (GitHub matrix limit is 256)'
        required: false
        default: '180'
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      stage: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "${{ inputs.stage }}" "${{ inputs.mode }}" "${{ inputs.chunks }}" "${{ inputs.src_run_id }}" "${{ inputs.wave }}" "${{ inputs.wave_size }}" <<'PY' > "$GITHUB_OUTPUT"
          import json, os, subprocess, sys
          stage, mode, override, src_run, wave, wave_size = sys.argv[1:7]
          if mode == "sanity":
              print("chunks=" + json.dumps([0])); sys.exit()
          if override.strip():
              print("chunks=" + json.dumps([int(x) for x in override.split(",") if x.strip()])); sys.exit()
          if src_run.strip():
              # generated sources live in the `tracka-src` artifact of that run
              subprocess.check_call(["gh", "run", "download", src_run,
                                     "-n", "tracka-src", "-D", "/tmp/src"])
              m = f"/tmp/src/stage{stage}/manifest.json"
          else:
              m = f"CA/harness/stages/stage{stage}/manifest.json"
          allc = [c["chunk"] for c in json.load(open(m))["chunks"]]
          W = int(wave_size)
          if len(allc) > W:
              w = int(wave) if wave.strip() else 0
              allc = allc[w * W:(w + 1) * W]
          print("chunks=" + json.dumps(allc))
          print("total=" + str(len(json.load(open(m))["chunks"])))
          PY
      - run: echo "stage=${{ inputs.stage }} mode=${{ inputs.mode }} chunks=${{ steps.plan.outputs.chunks }}"

  prove:
    needs: plan
    if: ${{ needs.plan.outputs.chunks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize project + chunk file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r CA/harness/skeleton probe
          mkdir -p probe/test
          if [ -n "${{ inputs.src_run_id }}" ]; then
            gh run download ${{ inputs.src_run_id }} -n tracka-src -D /tmp/src
            cp /tmp/src/stage${STAGE}/Stage${STAGE}Chunk_${{ matrix.chunk }}.sol probe/test/
          else
            cp CA/harness/stages/stage${STAGE}/Stage${STAGE}Chunk_${{ matrix.chunk }}.sol probe/test/
          fi
          ls -la probe/test/
          chmod -R a+rwX probe

      - name: Resume KCFG checkpoint (optional)
        if: ${{ inputs.resume_run_id != '' }}
        run: |
          # Kontrol stores proof state (incl. KCFG) under <root>/out/proofs/<test>.
          # Without restoring it, `kontrol prove` (no --reinit) restarts from root.
          mkdir -p probe/out/proofs
          gh run download ${{ inputs.resume_run_id }} \
            -n stage${STAGE}-kcfg-chunk-${{ matrix.chunk }} -D /tmp/kcfg_resume \
            || echo "no checkpoint on that run"
          if [ -f /tmp/kcfg_resume/kcfg_checkpoint.tgz ]; then
            tar -xzf /tmp/kcfg_resume/kcfg_checkpoint.tgz -C probe/out
            echo "restored proofs checkpoint: $(find probe/out/proofs -maxdepth 2 | wc -l) entries"
          else
            echo "no proofs checkpoint present -> proof restarts from root"
          fi
          chmod -R a+rwX probe

      - name: kontrol build (docker)
        run: |
          set -o pipefail
          cd probe
          docker run --rm -v "$PWD":/work/probe -w /work/probe \
            runtimeverificationinc/kontrol:ubuntu-jammy-1.0.255 \
            kontrol build 2>&1 | tee build_output.log | tail -3
          sudo chown -R $(id -u):$(id -g) .

      - name: kontrol prove (one invocation per test)
        run: |
          set +e
          TESTS_FILE="$GITHUB_WORKSPACE/CA/harness/stages/stage${STAGE}/chunk_${{ matrix.chunk }}.tests"
          cd probe
          chmod -R a+rwX .
          V=verdicts_chunk_${{ matrix.chunk }}.txt; : > "$V"
          # Bound the whole chunk to < the 350m job cap so every test in the
          # chunk gets a verdict (or an explicit INCOMPLETE) before the job dies.
          # NOTE: `timeout -k` is required — plain SIGTERM does NOT stop the
          # Kontrol container, so without --kill-after the job runs to GitHub's
          # 350m cap and gets cancelled with no artifacts uploaded.
          NTESTS=$(grep -c . "$TESTS_FILE")
          # Total chunk budget 300m (< 350m job cap). 1-test chunks get up to
          # 280m so large bytecodes can actually finish instead of rc=137.
          BUDGET=$(( 300 * 60 / NTESTS )); [ "$BUDGET" -gt 16800 ] && BUDGET=16800
          # Sound-only speedups: booster backend, no per-call nodes, drop stack
          # checks (compiler bytecode), no rewrite-trace logging, branch-level
          # parallelism, coarse CFG nodes, generous iteration cap, step-timeout
          # so a single hard step cannot eat the whole budget.
          PROVE_OPTS="--use-booster --no-break-on-calls --no-stack-checks --no-log-rewrites \
            --max-frontier-parallel 2 --max-depth 50000 --max-iterations 100000 \
            --smt-timeout 30000 --smt-retry-limit 2 --workers 2 --step-timeout 600 \
            --auto-abstract-gas"
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            echo "=== c${{ matrix.chunk }}: $t ===" | tee -a "$V" prove_output.log
            timeout -k 30s "${BUDGET}s" docker run --rm -v "$PWD":/work/probe -w /work/probe \
              runtimeverificationinc/kontrol:ubuntu-jammy-1.0.255 \
              kontrol prove \
              --match-test "${t}" \
              $PROVE_OPTS > /tmp/prove_one.log 2>&1
            rc=$?
            cat /tmp/prove_one.log >> prove_output.log
            if grep -qE 'PROOF (PASSED|FAILED)' /tmp/prove_one.log; then
              grep -E 'PROOF (PASSED|FAILED)' /tmp/prove_one.log >> "$V"
            elif [ "$rc" -eq 124 ]; then
              echo "=== $t INCOMPLETE (wall-timeout; kcfg checkpointed) ===" >> "$V"
            elif grep -qE 'FoundryCheat|#address\( FoundryCheat' /tmp/prove_one.log; then
              # symbolic-address/cheatcode artifact, NOT a finding (see CA/kontrol 08.4)
              echo "=== $t INCOMPLETE (CHEATCODE-FP; kcfg checkpointed) ===" >> "$V"
            elif grep -qE 'cannot shrink further|PENDING:' /tmp/prove_one.log; then
              echo "=== $t INCOMPLETE (ABORT: step budget; kcfg checkpointed) ===" >> "$V"
            elif grep -qE 'CHEATCODE_UNIMPLEMENTED|[Uu]nimplemented|Exception|Fatal' /tmp/prove_one.log; then
              echo "=== $t INCOMPLETE (abort; kcfg checkpointed) ===" >> "$V"
            else
              echo "=== $t INCOMPLETE (rc=$rc; kcfg checkpointed) ===" >> "$V"
            fi
            sudo chmod -R a+rwX .
          done < "$TESTS_FILE"
          sudo chown -R $(id -u):$(id -g) .
          # Kontrol proof dirs are named <test>:<version> (colon) and contain
          # parentheses — actions/upload-artifact@v4 rejects ':'. Tar the whole
          # proofs dir to one safe filename so the checkpoint can be uploaded.
          # `|| true`: when a test is SIGKILLed by `timeout -k`, the container
          # may still be writing `out/proofs`, so tar can exit 1 with
          # "file changed as we read it". That must NOT fail the job — every
          # verdict already produced is uploaded by the `if: always()` steps.
          if [ -d out/proofs ]; then
            tar -czf kcfg_checkpoint.tgz -C out proofs || true
            echo "checkpoint tar: $(du -h kcfg_checkpoint.tgz 2>/dev/null | cut -f1)"
          else
            echo "no out/proofs to checkpoint"
          fi
          exit 0

      - name: Extract verdicts
        if: always()
        run: cat probe/verdicts_chunk_${{ matrix.chunk }}.txt || true

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage${{ inputs.stage }}-results-chunk-${{ matrix.chunk }}
          path: |
            probe/verdicts_chunk_${{ matrix.chunk }}.txt
            probe/prove_output.log
            probe/build_output.log

      - name: Upload KCFG checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage${{ inputs.stage }}-kcfg-chunk-${{ matrix.chunk }}
          path: probe/kcfg_checkpoint.tgz
          if-no-files-found: ignore
          retention-days: 14
