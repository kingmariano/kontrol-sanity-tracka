# Stage 2 — deep auth (P4 two-phase transient, P3 naive-proxy).
# Run sanity (controls) first, then full.
name: stage2-deepauth

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sanity (controls only) | full'
        required: false
        default: 'sanity'
        type: choice
        options: [sanity, full]
      chunks:
        description: 'chunk indices (comma-separated); empty = all'
        required: false
        default: ''
        type: string
      resume_run_id:
        required: false
        default: ''
        type: string

jobs:
  run:
    uses: ./.github/workflows/stage-matrix.yml
    with:
      stage: '2'
      mode: ${{ inputs.mode }}
      chunks: ${{ inputs.chunks }}
      resume_run_id: ${{ inputs.resume_run_id }}
