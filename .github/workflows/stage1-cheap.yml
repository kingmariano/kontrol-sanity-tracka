# Stage 1 — cheap sweep (P1 unprotected write, P2 balance/selfdestruct).
# Run sanity (controls) first, then full.
name: stage1-cheap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sanity (controls only) | full'
        required: false
        default: 'sanity'
        type: choice
        options: [sanity, full]
      chunks:
        description: 'chunk indices (comma-separated); empty = all'
        required: false
        default: ''
        type: string
      resume_run_id:
        required: false
        default: ''
        type: string

jobs:
  run:
    uses: ./.github/workflows/stage-matrix.yml
    with:
      stage: '1'
      mode: ${{ inputs.mode }}
      chunks: ${{ inputs.chunks }}
      resume_run_id: ${{ inputs.resume_run_id }}
